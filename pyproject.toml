[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "certificate-automation"
version = "1.0.0"
description = "Offline Windows desktop application for verified certificate batch generation"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.0,<7",
    "openpyxl>=3.1,<4",
    "pypdf>=6,<7",
    "PySide6>=6.8,<6.9; python_version < '3.14'",
    "PySide6>=6.11,<7; python_version >= '3.14'",
    "pywin32>=311; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "pytest-qt>=4.4,<5",
]
build = [
    "pyinstaller>=6.16,<7",
]

[project.scripts]
certificate-automation = "certificate_automation.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "word_integration: requires 64-bit Windows with desktop Microsoft Word",
]
